<section class="not-found-page">
    <mat-card class="not-found-page__card" appearance="outlined">
        <mat-card-content>
            <p class="not-found-page__label">PAGE NOT FOUND</p>

            <h1 class="not-found-page__code">404</h1>

            <p class="not-found-page__message">The page you're looking for doesn't exist.</p>

            <button mat-stroked-button color="primary" type="button" [routerLink]="routePaths.home">
                Go Home
            </button>
        </mat-card-content>
    </mat-card>
</section>
