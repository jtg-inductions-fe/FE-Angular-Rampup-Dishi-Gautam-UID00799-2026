<section class="not-found-page">
    <mat-card
        class="not-found-card"
        appearance="outlined"
    >
        <mat-card-content>
            <p class="error-label">
                PAGE NOT FOUND
            </p>

            <h1 class="error-code">
                404
            </h1>

            <p class="error-message">
                The page you're looking for doesn't exist.
            </p>

            <a
                mat-stroked-button
                color="primary"
                routerLink="/"
            >
                Go Home
            </a>
        </mat-card-content>
    </mat-card>
</section>
