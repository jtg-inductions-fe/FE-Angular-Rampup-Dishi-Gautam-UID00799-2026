<section class="dashboard">
    <header class="dashboard__header">
        <div class="dashboard__heading">
            <h1 class="dashboard__title">Articles</h1>

            <p class="dashboard__description">
                Explore the latest stories and ideas.
            </p>
        </div>

        <button mat-flat-button color="primary" type="button">Create article</button>
    </header>

    <main class="dashboard__article-list">
        @for (article of articles(); track article.id) {
            <app-article-card [article]="article" />
        } @empty {
            <div class="dashboard__empty-state">
                <h2 class="dashboard__empty-title">No articles found</h2>

                <p class="dashboard__empty-description">
                    There are no articles available yet.
                </p>
            </div>
        }
    </main>
</section>
